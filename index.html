<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>الموقع</title>
</head>
<body>

    <!-- محتوى موقعك هنا -->

    <script>
      // ضَع الكود هنا
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlqu5_Og4Mjl3KuCp58dPWWOMHS7FzciNmK189TRnOBx0fnw9OZJzCHFSGTKXEQobTlg/exec";

      async function fetchData() {
          try {
              const response = await fetch(SCRIPT_URL);
              const data = await response.json();
              console.log("البيانات المستلمة:", data);
              return data;
          } catch (error) {
              console.error("حدث خطأ أثناء جلب البيانات:", error);
          }
      }

      // استدعاء الدالة عند تحميل الصفحة مثلاً
      fetchData();
    </script>
</body>
</html>
